services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: n5deal
      MYSQL_USER: n5deal
      MYSQL_PASSWORD: n5deal
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://n5deal:n5deal@mysql:3306/n5deal
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql-data:
