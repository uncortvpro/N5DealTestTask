# DigitalOcean App Platform spec for N5Deal.
#
# Usage:
#   doctl apps create --spec .do/app.yaml
# or paste this into the console's "Edit App Spec" YAML tab when creating
# an app from this GitHub repo.
#
# Before using this file:
#   1. Replace `owner/repo` below with your actual GitHub repo path.
#   2. Replace the JWT_SECRET value with a real secret (see README) —
#      do NOT commit a real secret in this file if the repo is public.
#      Easiest: leave the placeholder, deploy, then set the real value
#      in the console (App > api component > Settings > App-Level Env Vars),
#      which stores it encrypted and never shows it back in plain text.
#   3. Pick a `region` close to your users (nyc, sfo, ams, sgp, lon, fra, tor, blr).
#   4. MySQL only comes as a production-tier database on App Platform, and
#      production databases aren't provisioned inline from this file — create
#      the cluster first (Databases > Create Database Cluster > MySQL, cheapest
#      node), then set `cluster_name` below to that cluster's name.

name: n5deal
region: fra

databases:
  - name: n5deal-mysql
    engine: MYSQL
    production: true
    cluster_name: REPLACE_WITH_YOUR_DATABASE_CLUSTER_NAME

services:
  - name: api
    github:
      repo: uncortvpro/N5DealTestTask
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/Dockerfile.api
    # No http_port / public route on purpose: the browser only ever talks to
    # the `web` component's same-origin /api/* rewrite proxy, never directly
    # to this service — so it stays off the public internet entirely.
    internal_ports:
      - 4000
    # Without an http_port, DO defaults health checks to port 8080 — this
    # service listens on 4000, so the check must be pointed there explicitly
    # or DO marks it unhealthy and `web` can't reach it internally (ECONNREFUSED).
    health_check:
      port: 4000
      http_path: /health
      initial_delay_seconds: 20
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${n5deal-mysql.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_A_LONG_RANDOM_SECRET
      - key: PORT
        scope: RUN_TIME
        value: "4000"
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

  - name: web
    github:
      repo: uncortvpro/N5DealTestTask
      branch: main
      deploy_on_push: true
    dockerfile_path: docker/Dockerfile.web
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      # Bindable vars like ${api.PRIVATE_URL} are NOT resolvable at Dockerfile
      # build time (DO only resolves them at runtime) — but internal routing
      # between same-app components is deterministic (http://<component-name>:<port>),
      # so a plain literal string works here and matches the ARG default
      # already baked into docker/Dockerfile.web.
      #
      # Scope must be RUN_AND_BUILD_TIME, not just BUILD_TIME: next.config.mjs
      # reads this at build time for rewrites(), but apps/web/src/lib/config.ts
      # (used by every server component's apiFetch) reads process.env.API_INTERNAL_URL
      # again at request time in the running container — BUILD_TIME-only vars
      # aren't present there, so it silently falls back to localhost:4000 and
      # every server-side fetch to the API fails with ECONNREFUSED.
      - key: API_INTERNAL_URL
        scope: RUN_AND_BUILD_TIME
        value: http://api:4000
      - key: PORT
        scope: RUN_TIME
        value: "3000"
